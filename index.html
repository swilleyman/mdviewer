<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MD Viewer</title>
  <meta name="description" content="A fast, offline Markdown viewer and editor for desktop and mobile.">
  <meta id="themeColor" name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" id="hljsLight" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" id="hljsDark" crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="md.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="26" height="26">
      <span id="docName" class="doc-name" title="">Untitled.md</span>
      <span id="dirty" class="dirty" title="Unsaved changes" hidden></span>
    </div>
    <div class="actions">
      <button id="btnOpen" class="icon-btn" title="Open file (Ctrl+O)" aria-label="Open file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <div class="seg" role="group" aria-label="View mode">
        <button data-mode="edit" title="Edit (Ctrl+E toggles)">Edit</button>
        <button data-mode="split" class="wide-only" title="Side by side">Split</button>
        <button data-mode="view" title="Preview">View</button>
      </div>
      <button id="btnToc" class="icon-btn" title="Outline" aria-label="Outline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M8 12h12M8 18h12M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="btnTheme" class="icon-btn" title="Theme" aria-label="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18z" class="fill"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button id="btnMenu" class="icon-btn" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4" class="fill"/><circle cx="12" cy="12" r="1.4" class="fill"/><circle cx="12" cy="19" r="1.4" class="fill"/></svg>
      </button>
    </div>
  </header>

  <div id="menu" class="menu" role="menu" hidden>
    <button role="menuitem" data-act="new">New document</button>
    <button role="menuitem" data-act="open">Open file…</button>
    <button role="menuitem" data-act="url">Open from URL…</button>
    <hr>
    <button role="menuitem" data-act="save">Save .md</button>
    <button role="menuitem" data-act="share" hidden>Share…</button>
    <button role="menuitem" data-act="html">Export HTML</button>
    <button role="menuitem" data-act="print">Print / PDF</button>
    <hr>
    <div class="menu-row">
      <span>Text size</span>
      <span class="stepper">
        <button data-act="smaller" aria-label="Smaller text">A−</button>
        <button data-act="larger" aria-label="Larger text">A+</button>
      </span>
    </div>
    <button role="menuitem" data-act="install" hidden>Install app</button>
    <button role="menuitem" data-act="welcome">Show guide</button>
  </div>

  <main id="main" class="main" data-mode="view">
    <section class="pane editor-pane">
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Type or paste Markdown…" aria-label="Markdown source"></textarea>
    </section>
    <section id="previewPane" class="pane preview-pane">
      <article id="preview" class="md"></article>
    </section>
  </main>

  <aside id="toc" class="toc" hidden aria-label="Outline">
    <div class="toc-head">
      <strong>Outline</strong>
      <button id="tocClose" class="icon-btn" aria-label="Close outline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="tocList"></nav>
  </aside>

  <footer class="status">
    <span id="stats"></span>
    <span id="saveState"></span>
  </footer>

  <div id="drop" class="drop" hidden><div>Drop a Markdown file to open it</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>

  <dialog id="urlDialog">
    <form method="dialog" id="urlForm">
      <label for="urlInput"><strong>Open from URL</strong></label>
      <p class="hint">Raw Markdown links work best. GitHub file links are converted automatically.</p>
      <input id="urlInput" type="url" inputmode="url" placeholder="https://github.com/user/repo/blob/main/README.md" required>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate class="btn">Cancel</button>
        <button value="ok" class="btn primary">Open</button>
      </div>
    </form>
  </dialog>

  <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
